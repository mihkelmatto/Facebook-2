<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Post</title>

    <link rel="stylesheet" href="/resources/css/global.css">
    <link rel="stylesheet" href="/resources/css/addPost.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <ul>
                <li>
                    <a href="/index.html">Home</a>
                </li>

                <li>
                    <a href="/html/addPost.html">Add Post</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <form class="addpost"
            action="/action_page.php"
            method="post"
            enctype="multipart/form-data">

            <p class="addpost-title">
                Add post
            </p>

            <textarea
                id="post-textarea"
                class="addpost-textarea"
                placeholder="What's on your mind?"
            ></textarea>

            <p class="addpost-subtitle">
                Select an image to upload
            </p>

            <label for="image" 
                class="button addpost-file">
                choose file
            </label>
            <input
                id="image"
                type="file"
                accept="image/*"
                hidden>
            <label for="submit"
                class="button addpost-submit">
                create post
            </label>
            <input
                type="submit"
                value="Create post"
                hidden>
        </form>
    </main>

    <footer>

    </footer>
</body>
</html>
