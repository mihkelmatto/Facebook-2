<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="/resources/css/global.css">
    <link rel="stylesheet" href="/resources/css/index.css">
</head>

<body>

    <main>

        <form
            class="login-form"
            action="/html/home.html"
            method="get">

            <p class="login-title">
                Login
            </p>

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                required>

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="text"
                name="password"
                required>

            <div class="buttonsbox">
                <button
                    type="submit"
                    name="action"
                    value="register"
                    class="button register-button">
                    Register
                </button>
                <button
                    type="submit"
                    name="action"
                    value="login"
                    class="button login-button">
                    Login
                </button>
            </div>

            <label for="forgot-password"
                class="forgot-password">
                forgot password
            </label>
            <input
                type="forgot-password"
                value="Create post"
                hidden>

        </form>

    </main>

</body>
</html>
