
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="resources/css/global.css">
    <link rel="stylesheet" href="resources/css/index.css">
</head>

<body>

    <main>

        <form
            class="login-form"
            action="html/home.html"
            method="get">

            <p class="login-title">
                Login
            </p>

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                required>

            <label for="password">
                Password
            </label>

            <div class="password-container">

                <input
                    id="password"
                    type="password"
                    name="password"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false">

                    <svg
                        id="eyeIcon"
                        xmlns="http://www.w3.org/2000/svg"
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>

                    </svg>

                </button>

            </div>

            <div class="buttonsbox">

                <button
                    type="submit"
                    name="action"
                    value="register"
                    class="button register-button">
                    Register
                </button>

                <button
                    type="submit"
                    name="action"
                    value="login"
                    class="button login-button">
                    Login
                </button>

            </div>

            <a href="html/forgotPassword.html"
               class="forgot-password">
                Forgot password?
            </a>

        </form>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", () => {
            const showPassword = passwordInput.type === "password";

            passwordInput.type = showPassword ? "text" : "password";

            togglePassword.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );

            togglePassword.setAttribute(
                "aria-pressed",
                String(showPassword)
            );

            eyeIcon.innerHTML = showPassword
                ? `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-4 4.9"/>
                    <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3.4-.6"/>
                `
                : `
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
        });
    </script>

</body>
</html>
