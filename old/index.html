<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="resources/css/global.css">
    <link rel="stylesheet" href="resources/css/index.css">
    <script type="module" src="js/pages/index.js"></script>
</head>

<body>
    <main>
        <form
            id="loginform"
            class="login-form">

            <p class="login-title">
                Login
            </p>
            
            <!-- Email field -->
            <label for="email">
                Email
            </label>
            <input
                id="email"
                type="email"
                name="email"
                required>

            <!-- Password field -->
            <label for="password">
                Password
            </label>
            <div class="password-container">

                <input
                    id="password"
                    type="password"
                    name="password"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false">

                    <svg
                        id="eyeIcon"
                        xmlns="http://www.w3.org/2000/svg">
                    </svg>
                </button>
            </div>

            <!-- Buttons -->
            <div class="buttonsbox">
                <button
                    type="submit"
                    name="action"
                    value="register"
                    class="button register-button">
                    Register
                </button>

                <button
                    type="submit"
                    name="action"
                    value="login"
                    class="button login-button">
                    Login
                </button>
            </div>

            <a
                href="html/forgotPassword.html"
                class="forgot-password">
                Forgot password?
            </a>
        </form>
    </main>
</body>
</html>
